# LiteLLM proxy config — fronts AWS Bedrock with an OpenAI-compatible API.
#
# Run:  litellm --config litellm_config.yaml --port 4000
# Then config.py points GENERATOR/PREFILTER/SCORER keys at
# base_url=http://localhost:4000/v1 with a dummy api_key.
#
# Auth: reads AWS_BEARER_TOKEN_BEDROCK + AWS_REGION_NAME from the environment.
# LiteLLM also accepts AWS_ACCESS_KEY_ID/SECRET pairs if you switch off the
# Bedrock API key later.

model_list:
  # --- Prefilter: cheapest possible, tiny outputs ---
  - model_name: nova-micro
    litellm_params:
      model: bedrock/amazon.nova-micro-v1:0
      aws_region_name: us-east-1

  # --- Generator: cheap + structured-JSON friendly ---
  - model_name: nova-lite
    litellm_params:
      model: bedrock/amazon.nova-lite-v1:0
      aws_region_name: us-east-1

  # --- Scorer: needs real reasoning to avoid sycophancy ---
  # Scorer — Nova Pro. Amazon's own model, on-demand guaranteed in us-east-1,
  # same family as the gen/prefilter so no new auth surface. $0.80 / $3.20 per M.
  - model_name: scorer
    litellm_params:
      model: bedrock/amazon.nova-pro-v1:0
      aws_region_name: us-east-1

litellm_settings:
  drop_params: true       # silently drop OpenAI-only params Bedrock doesn't accept
  request_timeout: 60     # match the AsyncOpenAI client-side timeout

general_settings:
  # No master key — proxy is bound to localhost only. If you ever expose
  # this beyond loopback, set master_key here and require it in clients.
  telemetry: false
